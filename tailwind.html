<!DOCTYPE html>
<html lang="pt-BR">
 
<head>
 
    <meta charset="UTF-8">
 
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
 
    <title>Cards com Tailwind</title>
 
    <script src="https://cdn.tailwindcss.com"></script>
 
</head>
 
<body class="bg-gray-100">
 
    <div class="container mx-auto px-6 py-10">
 
        <h1 class="text-4xl font-bold text-center mb-10">
            Nossos Produtos
        </h1>
 
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
 
            <!-- CARD 1 -->
 
            <div class="bg-white rounded-lg shadow-lg p-6">
 
                <div class="bg-pink-200 h-40 rounded-lg mb-4 flex items-center justify-center">
 
                    <span class="text-5xl">
                        👗
                    </span>
 
                </div>
 
                <h2 class="text-2xl font-bold mb-2">
                    Vestido Floral
                </h2>
 
                <p class="text-gray-600 mb-4">
                    Vestido leve e confortável para o verão.
                </p>
 
                <button class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
                    Comprar
                </button>
 
            </div>
 
 
            <!-- CARD 2 -->
 
            <div class="bg-white rounded-lg shadow-lg p-6">
 
                <div class="bg-blue-200 h-40 rounded-lg mb-4 flex items-center justify-center">
 
                    <span class="text-5xl">
                        👚
                    </span>
 
                </div>
 
                <h2 class="text-2xl font-bold mb-2">
                    Blusa Cropped
                </h2>
 
                <p class="text-gray-600 mb-4">
                    Modelo moderno para diferentes ocasiões.
                </p>
 
                <button class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
                    Comprar
                </button>
 
            </div>
 
 
            <!-- CARD 3 -->
 
            <div class="bg-white rounded-lg shadow-lg p-6">
 
                <div class="bg-yellow-200 h-40 rounded-lg mb-4 flex items-center justify-center">
 
                    <span class="text-5xl">
                        👜
                    </span>
 
                </div>
 
                <h2 class="text-2xl font-bold mb-2">
                    Bolsa
                </h2>
 
                <p class="text-gray-600 mb-4">
                    Bolsa prática e perfeita para o dia a dia.
                </p>
 
                <button class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
                    Comprar
                </button>
 
            </div>
 
        </div>
 
    </div>
 
</body>
</html>
